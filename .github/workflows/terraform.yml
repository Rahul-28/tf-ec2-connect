name: CI Pipeline
run-name: ${{ github.actor }} has triggered GitHub Actions 🚀

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  include:
    runs-on: ubuntu_latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Run terraform Validate
        run: terraform validate
      
      - name: Run Terraform fmt
        run: terraform fmt -check -recursive
        

